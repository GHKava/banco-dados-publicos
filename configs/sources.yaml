version: 1

sources:
  - source_id: "SRC-001"
    name: "Diário Oficial da União (DOU) - Imprensa Nacional"
    owner_org: "Imprensa Nacional"
    base_domains: ["in.gov.br"]
    entrypoints:
      - "https://www.in.gov.br/"
    discovery:
      method: "html_index"
      urls:
        - "https://www.in.gov.br/leiturajornal"
    crawl_policy:
      robots_respect: true
      user_agent: "PublicDataPipelineBot/1.0 (contact: <email>)"
      rate_limit_rps: 0.2
      concurrency: 1
      allow_paths: ["/", "/leiturajornal", "/web/dou"]
      deny_paths: []
    license_policy:
      license_status: "unknown"
      license_evidence: "Registrar ToS/licença em Fontes_Licencas.md"
      default_storage_mode: "METADATA_ONLY"
    data_handling:
      pii_expected: "medium"
      pii_actions: ["detect", "redact"]
      retention_days: 365
    notes: "MVP: armazenar metadados + link; liberar texto integral somente após licença verificada."

