      concurrency: 2
      allow_paths: ["/api/"]
      deny_paths: []
    license_policy:
      license_status: "unknown"
      license_evidence: "Registrar termos de uso/licença em Fontes_Licencas.md"
      default_storage_mode: "ALLOW_FULLTEXT"
    data_handling:
      pii_expected: "low"
      pii_actions: ["detect"]
      retention_days: 365
    notes: "Fonte via API: normalmente mais segura. Confirmar termos e manter citações."

