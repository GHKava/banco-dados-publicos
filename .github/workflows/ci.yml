name: CI - Lint, Typecheck, Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint with black
        run: |
          black --check --line-length=120 src/ tests/
        continue-on-error: false

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503 --count --show-source --statistics
        continue-on-error: false

      - name: Check imports with isort
        run: |
          isort --check-only --profile=black --line-length=120 src/ tests/
        continue-on-error: false

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-implicit-optional --warn-unused-ignores
        continue-on-error: true # Non-blocking até código ter mais type hints

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
        continue-on-error: true # Non-blocking até ter testes

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
