[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banco-dados-dados-publicos"
version = "0.1.0-alpha"
description = "Pipeline industrial de ingestão → limpeza → enriquecimento → indexação → serving de dados públicos, com governança e compliance como primeira etapa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Gustavo", email = "gustavo@example.com" }]

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "rq>=1.14.1",
    "trafilatura>=1.6.5",
    "beautifulsoup4>=4.12.2",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "presidio-analyzer>=2.2.354",
    "datasketch>=1.0.8",
    "structlog>=23.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "pre-commit>=3.5.0",
]

ocr = ["pytesseract>=0.3.10"]

docs = ["mkdocs>=1.5.3", "markdown>=3.5.1"]

[project.urls]
Homepage = "https://github.com/[org]/banco-dados-dados-publicos"
Repository = "https://github.com/[org]/banco-dados-dados-publicos.git"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
